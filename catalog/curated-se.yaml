# Curated Swedish stations (region "se"). Sveriges Radio streams: live1.sr.se/<channel>-aac-320|128 (current pattern,
# the old http-live.sr.se mounts were shut down in 2025). The legacy srapi URLs redirect to the new streams.
# More stations are added by `npm run import` (Radio Browser SE + catalog/imports/se/*.m3u).

- id: se-sr-p1
  name: Sveriges Radio P1
  frequency: WEB
  genres: [news]
  homepage: https://sverigesradio.se/p1
  streams:
    - { url: "https://live1.sr.se/p1-aac-320", quality: high }
    - { url: "https://live1.sr.se/p1-aac-128", quality: medium }
    - { url: "https://sverigesradio.se/topsy/direkt/srapi/132.mp3", quality: medium }

