# Curated Spanish stations (region "es"). URLs come from the TDTChannels list (github.com/LaQuay/TDTChannels).
# build.ts checks every stream and drops dead ones. More stations are added automatically by `npm run import`
# (TDTChannels + Radio Browser + catalog/imports/es/*.m3u).

- id: es-cadena-ser
  name: Cadena SER
  frequency: WEB
  genres: [news]
  homepage: https://cadenaser.com/
  streams:
